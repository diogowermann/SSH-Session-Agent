[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-session-agent"
version = "0.1.0"
description = "Low-intrusion Linux SSH session telemetry agent for Remote Session API v2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Diogo Wermann"}]
dependencies = []

[project.scripts]
ssh-session-agent = "ssh_session_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
